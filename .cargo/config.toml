[build]
# Per-profile rustflags require nightly Rust
# This ensures CI/release builds are portable (generic CPU)
# while dev builds use native CPU for faster local iteration

[target.x86_64-unknown-linux-gnu]
linker = "clang"

[profile.dev]
rustflags = ["-C", "target-cpu=native"]

[profile.release]
rustflags = ["-C", "target-cpu=generic"]
